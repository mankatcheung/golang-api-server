apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: golang-api-server
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              for node in redis-0.redis-headless redis-1.redis-headless redis-2.redis-headless; do
                until redis-cli -h $node ping; do echo "waiting for $node"; sleep 2; done
                echo "$node is ready"
              done
      containers:
        - name: cluster-init
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              if redis-cli -h redis-0.redis-headless cluster info | grep -q "cluster_state:ok"; then
                echo "Cluster already initialized"
              else
                redis-cli --cluster create \
                  redis-0.redis-headless:6379 \
                  redis-1.redis-headless:6379 \
                  redis-2.redis-headless:6379 \
                  --cluster-replicas 0 --cluster-yes
              fi
