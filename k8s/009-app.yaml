apiVersion: apps/v1
kind: Deployment
metadata:
  name: golang-api-server
  namespace: golang-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: golang-api-server
  template:
    metadata:
      labels:
        app: golang-api-server
    spec:
      containers:
        - name: golang-api-server
          image: golang-api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          envFrom:
            - configMapRef:
                name: golang-api-server-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: golang-api-server-secret
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: golang-api-server
  namespace: golang-api-server
spec:
  type: NodePort
  selector:
    app: golang-api-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30090
