apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: golang-api-server
spec:
  instances: 3
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-credentials
  bootstrap:
    initdb:
      database: users_db
      owner: postgres
      secret:
        name: postgres-credentials
  storage:
    size: 1Gi
