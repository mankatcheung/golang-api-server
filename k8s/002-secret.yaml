apiVersion: v1
kind: Secret
metadata:
  name: golang-api-server-secret
  namespace: golang-api-server
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: golang-api-server
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: postgres
