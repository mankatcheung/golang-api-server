apiVersion: v1
kind: ConfigMap
metadata:
  name: golang-api-server-config
  namespace: golang-api-server
data:
  APP_ENV: "development"
  SERVER_ADDRESS: ":8080"
  SERVER_TIMEOUT: "30"
  GRPC_ADDRESS: ":9090"
  ALLOWED_ORIGINS: "*"
  DATABASE_URL: "postgres://postgres:postgres@pgbouncer:5432/users_db?sslmode=disable"
  DATABASE_READ_URL: "postgres://postgres:postgres@postgres-ro:5432/users_db?sslmode=disable"
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  JWT_ACCESS_EXPIRY: "15"
  JWT_REFRESH_EXPIRY: "7"
  REDIS_ADDRS: "redis-0.redis-headless:6379,redis-1.redis-headless:6379,redis-2.redis-headless:6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  CACHE_TTL: "600"
  KAFKA_BROKERS: "kafka-0.kafka-headless:9092,kafka-1.kafka-headless:9092,kafka-2.kafka-headless:9092"
  KAFKA_TOPIC: "conversions"
  KAFKA_GROUP_ID: "api-server"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_KAFKA_TOPIC: "app-logs"
  LOG_KAFKA_GROUP_ID: "log-consumer"
  AUTH_RATE_LIMIT: "10"
  API_RATE_LIMIT: "60"
